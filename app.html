/* Фильтр инверсии применяется не к #shell целиком (иначе он становится "контейнером" для
   всех вложенных position:fixed элементов — таб-бар и т.п. перестают быть закреплены к экрану
   и уезжают при скролле), а к каждому верхнеуровневому блоку внутри #app по отдельности —
   визуально эффект тот же, но fixed-элементы остаются зафиксированы относительно экрана. */
#shell[data-theme="dark"]{background:#0e1811;}
#shell[data-theme="dark"] > #app > *{filter:invert(1) hue-rotate(180deg);}
#shell[data-theme="dark"] img{filter:invert(1) hue-rotate(180deg);}

  }

}

}

function maybeSendReceipt(order){
  // Чек формируется только если подключена онлайн-касса (54-ФЗ). Пока — нет.
  if (!INTEGRATIONS.receiptProviderReady) return false;
  console.log('[maybeSendReceipt] чек по заказу №'+order.id+' отправлен на '+order.email);
  return true;
}

// Единая точка обработки успешной оплаты — вызывается один раз на заказ.
function confirmPayment(orderId, paymentPayload){
  const order = state.orders.find(function(o){ return o.id===orderId; });
  if (!order) return false;
  if (order.status==='paid' || order.status==='processing' || order.status==='delivered') return true; // защита от повторного вызова (идемпотентность вебхука)

  order.status = 'paid';
  order.paidAt = formatToday();
  order.payment = {
    provider: (paymentPayload && paymentPayload.provider) || 'mock',
    transactionId: (paymentPayload && paymentPayload.transactionId) || ('MOCK-'+order.id),
  };
  if (!order.statusHistory) order.statusHistory = [];
  order.statusHistory.push({status:'paid', ts:formatToday(), by:'система (оплата)'});
  saveState(); // сохранить заказ

  order.sellerNotified = notifySeller(order);
  order.buyerConfirmationSent = sendBuyerPaymentConfirmation(order);
  order.receiptSent = maybeSendReceipt(order);
  saveState();
  return true;
}

function loadState(){

    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}

  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ============================== LOGIC (pure) ============================== */

function getProduct(id){ return (state.products||ALL_PRODUCTS).find(p=>p.id===id); }

function cartTotalSlots(cart){ return cart.reduce((s,e)=>s+(e.bulk?2:1),0); }

function cartTotalPrice(cart){
  return cart.reduce((s,e)=>{
    const p = getProduct(e.productId);
    return s + (p ? p.price : 0);
  },0);
}

function cartTotalPieces(cart){
  return cart.reduce((s,e)=>{
    const p = getProduct(e.productId);
    return s + (p ? p.pieces : 0);
  },0);
}

function slotsNeededToComplete(slots){
  if (slots===0) return 2;
  if (slots%2===0) return 0;
  return 1;
}

function canCheckout(cart){
  const s = cartTotalSlots(cart);
  return s>0 && s%2===0;
}

// Groups flat cart entries into boxes of 2 positions each.
// A bulk entry (a "большая коробка") always occupies a whole box by itself.
function computeBoxes(cart){
  const boxes = [];
  let current = [];
  cart.forEach(function(entry){
    if (entry.bulk){
      if (current.length){ boxes.push(current); current = []; }
      boxes.push([entry]);
    } else {
      current.push(entry);
      if (current.length===2){ boxes.push(current); current = []; }
    }
  });
  if (current.length) boxes.push(current);
  return boxes;
}

function boxIsComplete(box){ return box.length===2 || (box.length===1 && box[0].bulk); }

function groupEntries(entries){
  const map = new Map();
  entries.forEach(function(e){
    const key = e.productId + '|' + (e.species||'');
    if (!map.has(key)) map.set(key, Object.assign({}, e, {count:0}));
    map.get(key).count++;
  });
  return Array.from(map.values());
}

function addEntry(productId, opts){
  state.cart.push(Object.assign({productId:productId, bulk:false, uid:state.nextEntryUid++}, opts||{}));
}

function removeLastEntryForProduct(productId){
  for (let i=state.cart.length-1;i>=0;i--){
    if (state.cart[i].productId===productId){ state.cart.splice(i,1); return; }
  }
}

function changeUnits(productId, delta){
  if (delta>0) addEntry(productId);
  else removeLastEntryForProduct(productId);
  saveState();
}

function addUnitsBulk(productId, units){
  for (let i=0;i<units;i++) addEntry(productId);
  saveState();
}

function applyPromoCode(code, subtotal){
  const key = (code||'').trim().toUpperCase();
  const list = (state.promoCodes||[]);
  const promo = list.find(function(p){ return p.code.toUpperCase()===key; });
  if (!promo || promo.active===false) return { valid:false, code:key, rate:0, discount:0 };
  if (promo.expiry && new Date(promo.expiry) < new Date()) return { valid:false, code:key, rate:0, discount:0 };
  if (promo.usageLimit!=null && promo.usedCount>=promo.usageLimit) return { valid:false, code:key, rate:0, discount:0 };
  const discount = promo.type==='fixed' ? Math.min(promo.value, subtotal) : Math.round(subtotal*promo.value/100);
  return { valid:true, code:key, rate:promo.type==='percent'?promo.value/100:null, discount:discount };
}

function filterProducts(products, opts){
  opts = opts || {};
  return products.filter(function(p){
    const cat = p.filterGroup || p.category;
    if (opts.category && opts.category!=='all' && cat!==opts.category) return false;
    if (opts.query){
      const q = opts.query.toLowerCase();
      if (p.name.toLowerCase().indexOf(q)===-1 && !(p.latin && p.latin.toLowerCase().indexOf(q)!==-1)) return false;
    }
    return true;
  });
}

function sortProducts(products, sortKey){
  const arr = products.slice();
  if (sortKey==='price_asc') arr.sort((a,b)=>a.price-b.price);
  else if (sortKey==='price_desc') arr.sort((a,b)=>b.price-a.price);
  return arr;
}

function formatPrice(n){ return n.toLocaleString('ru-RU') + ' ₽'; }

const MONTHS_RU = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function formatDateRange(minDays, maxDays, from){
  from = from || new Date();
  const d1 = new Date(from); d1.setDate(d1.getDate()+minDays);
  const d2 = new Date(from); d2.setDate(d2.getDate()+maxDays);
  if (d1.getMonth()===d2.getMonth()) return d1.getDate()+'–'+d2.getDate()+' '+MONTHS_RU[d1.getMonth()];
  return d1.getDate()+' '+MONTHS_RU[d1.getMonth()]+' – '+d2.getDate()+' '+MONTHS_RU[d2.getMonth()];
}

function formatToday(){
  const d = new Date();
  return d.getDate()+' '+MONTHS_RU[d.getMonth()];
}

// Точная дата и время в московской таймзоне — для админ-панели (заказы должны показывать
// точное время оформления по МСК, независимо от часового пояса устройства, на котором открыта админка).
function formatMoscowDateTime(iso){
  if (!iso) return '—';
  try{
    const d = new Date(iso);
    const datePart = d.toLocaleDateString('ru-RU', {timeZone:'Europe/Moscow', day:'2-digit', month:'2-digit', year:'numeric'});
    const timePart = d.toLocaleTimeString('ru-RU', {timeZone:'Europe/Moscow', hour:'2-digit', minute:'2-digit'});
    return datePart+', '+timePart+' МСК';
  }catch(e){ return '—'; }
}

// Russian phone mask: always starts with 7, max 11 digits total, grouped as +7 XXX XXX XX XX
function formatPhoneDigits(digits){
  let out = '+7';
  const rest = digits.slice(1);
  if (rest.length>0) out += ' ' + rest.slice(0,3);
  if (rest.length>3) out += ' ' + rest.slice(3,6);
  if (rest.length>6) out += ' ' + rest.slice(6,8);
  if (rest.length>8) out += ' ' + rest.slice(8,10);
  return out;
}

function sanitizePhoneInput(raw){
  let digits = (raw||'').replace(/\D/g,'');
  if (digits.length===0) digits = '7';
  else if (digits[0]==='8') digits = '7'+digits.slice(1);
  else if (digits[0]!=='7') digits = '7'+digits;
  digits = digits.slice(0,11);
  return formatPhoneDigits(digits);
}

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((email||'').trim());
}

function validateContact(form){
  const errors = {};
  if (!form.name || form.name.trim().length<2) errors.name = 'Введите имя и фамилию';
  const digits = (form.phone||'').replace(/\D/g,'');
  if (digits.length<11) errors.phone = 'Введите номер телефона полностью';
  if (!isValidEmail(form.email)) errors.email = 'Введите корректный email — на него придёт чек';
  if (!form.city || form.city.trim().length<2) errors.city = 'Укажите город';
  if (!form.address || form.address.trim().length<3) errors.address = 'Укажите адрес или пункт выдачи СДЭК';
  if (!form.legalConsent) errors.legalConsent = 'Необходимо согласие на обработку персональных данных';
  return errors;
}

function parseRoute(){
  const hash = (location.hash||'').replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  return { name: parts[0] || 'home', param: parts[1], param2: parts[2] };
}

function go(route){ location.hash = route; }

let currentActiveNav = 'home';
let lastRouteName = null;

function render(preserveScroll){
  const {name, param, param2} = parseRoute();
  // Баннер коробки должен быть свёрнут при каждом свежем входе в каталог (но не сворачиваться
  // заново, если пользователь просто переключает фильтр "Сеянцы/Саженцы" уже находясь внутри).
  if (name==='catalog' && lastRouteName!=='catalog') state.boxWidgetCollapsed = true;
  lastRouteName = name;
  let html = '';
  currentActiveNav = '';
  switch(name){
    case 'home': html = screenHome(); currentActiveNav='home'; break;
    case 'catalog': html = screenCatalog(param); currentActiveNav='catalog'; break;
    case 'product': html = screenProduct(param); break;
    case 'cart': html = screenCart(); currentActiveNav='cart'; break;
    case 'checkout': html = screenCheckout(); break;
    case 'delivery': html = screenDelivery(); break;
    case 'profile': html = screenProfile(); currentActiveNav='profile'; break;
    case 'orders': html = param ? screenOrderDetail(param) : screenOrders(); currentActiveNav='profile'; break;
    case 'success': html = screenSuccess(param); break;
    case 'favorites': html = screenFavorites(); currentActiveNav='profile'; break;
    case 'notifications': html = screenNotifications(); currentActiveNav='profile'; break;
    case 'support': html = screenSupport(); currentActiveNav='profile'; break;
    case 'addresses': html = screenAddresses(); currentActiveNav='profile'; break;
    case 'app-settings': html = screenAppSettings(); currentActiveNav='profile'; break;
    case 'admin': html = screenAdmin(param, param2); currentActiveNav=''; break;
    default: html = screenHome(); currentActiveNav='home';
  }
  const shellEl = document.getElementById('shell');
  if (shellEl) shellEl.style.maxWidth = (name==='admin') ? '1040px' : '480px';
  applyTheme();
  try{ document.title = state.settings.companyName || 'Живое Наследие'; }catch(e){}
  const scrollPos = window.scrollY;
  // Полоса вкладок админ-панели пересоздаётся при каждом рендере и без этого всегда
  // "прыгала" обратно в начало — запоминаем, куда её докрутил пользователь, и восстанавливаем.
  const adminTabsScrollEl = document.getElementById('adminTabsScroll');
  const adminTabsScrollPos = adminTabsScrollEl ? adminTabsScrollEl.scrollLeft : null;
  document.getElementById('app').innerHTML = html;
  if (preserveScroll) window.scrollTo(0, scrollPos);
  else window.scrollTo(0,0);
  if (adminTabsScrollPos !== null){
    const newAdminTabsScrollEl = document.getElementById('adminTabsScroll');
    if (newAdminTabsScrollEl) newAdminTabsScrollEl.scrollLeft = adminTabsScrollPos;
  }
  tgUpdateBackButton(name);
  // На случай если Telegram полностью перезагрузит WebView (например, после сворачивания —
  // см. disableVerticalSwipes выше) — запоминаем текущий раздел, чтобы восстановить его при
  // следующем открытии вместо того, чтобы всегда начинать с главной.
  try{ localStorage.setItem('zn_last_hash', location.hash || ''); }catch(e){}
}

function screenCart(){
  const cart = state.cart;
  const subtotal = cartTotalPrice(cart);
  const slots = cartTotalSlots(cart);
  const promo = state.cart.length && state.appliedPromo ? state.appliedPromo : null;
  const discount = promo ? promo.discount : 0;
  const total = Math.max(0, subtotal-discount);
  const ok = canCheckout(cart);
  const pieces = cartTotalPieces(cart);

  const boxes = computeBoxes(cart);
  const boxesHtml = boxes.map(function(box, idx){
    const complete = boxIsComplete(box);
    const boxSlots = box.reduce(function(s,e){ return s+(e.bulk?2:1); },0);
    const rows = box.map(function(entry){
      const p = getProduct(entry.productId);
      const photo = entry.bulk ? getProduct(entry.species).img : p.img;
      return '<div style="display:flex;gap:12px;align-items:center;padding:8px 0;">'
        + '<div style="width:56px;height:56px;border-radius:12px;flex-shrink:0;overflow:hidden;"><img src="'+img(photo)+'" style="width:100%;height:100%;object-fit:cover;"></div>'
        + '<div style="flex:1;">'
        + '<div style="font-weight:700;font-size:13px;">'+boxEntryLabel(entry)+'</div>'
        + '<div style="font-size:11px;color:#8A968E;margin-top:2px;">'+formatPrice(getProduct(entry.productId).price)+'</div>'
        + '</div>'
        + '<div data-remove-entry="'+entry.uid+'" style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#C97A5A;font-size:16px;flex-shrink:0;">×</div>'
        + '</div>';
    }).join('<div style="border-top:1px solid #F0ECE0;"></div>');
    return '<div style="background:#fff;border:1px solid #ECE7DA;border-radius:16px;padding:12px 14px;margin-bottom:12px;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
      + '<span style="font-weight:700;font-size:13.5px;color:#21362A;">Коробка '+(idx+1)+'</span>'
      + '<span style="font-size:11px;font-weight:700;color:'+(complete?'#5A8D5F':'#C97A5A')+';">'+boxSlots+' из 2 мест'+(complete?' · собрана':'')+'</span>'
      + '</div>'
      + rows
      + '</div>';
  }).join('');

  const emptyState = '<div style="text-align:center;padding:60px 20px;color:#8A968E;">'
    + '<div style="font-size:14px;margin-bottom:16px;">Коробка пока пуста</div>'
    + '<button data-nav="#/catalog" class="primary-btn" style="width:auto;padding:12px 24px;">Перейти в каталог</button></div>';

  const slotNote = cart.length===0 ? '' : (ok
    ? '<div style="font-size:12px;color:#5A8D5F;font-weight:700;margin-top:6px;">'+ICONS.check+' Все коробки собраны ('+boxes.length+') — можно оформить</div>'
    : '<div style="font-size:12px;color:#C97A5A;font-weight:700;margin-top:6px;">Занято мест: '+slots+'. Добавьте ещё '+slotsNeededToComplete(slots)+', чтобы оформить заказ</div>');

  const bottomPanel = cart.length===0 ? '' : (
    '<div style="flex-shrink:0;background:#fff;border-top:1px solid #ECE7DA;padding:14px 20px;box-shadow:0 -8px 20px rgba(24,42,32,0.06);">'
    + '<div style="display:flex;gap:10px;">'
    + '<input id="promoInput" placeholder="Промокод" value="'+(state.promoInput||'')+'" style="flex:1;background:#fff;border:1px solid #E4DFD2;border-radius:14px;padding:12px 14px;font-size:13px;color:#21362A;outline:none;">'
    + '<button data-apply-promo style="background:#21362A;color:#F3EEE3;border:none;padding:0 20px;border-radius:14px;font-size:13px;font-weight:700;">Применить</button>'
    + '</div>'
    + (state.promoMessage ? '<div style="font-size:11.5px;color:'+(promo?'#5A8D5F':'#C97A5A')+';margin-top:6px;">'+state.promoMessage+'</div>' : '')
    + '<div style="margin-top:14px;padding-top:14px;border-top:1px solid #E4DFD2;display:flex;flex-direction:column;gap:8px;">'

/* ============================== ACTIONS ============================== */

function handleApplyPromo(){
  const code = state.promoInput || '';
  const subtotal = cartTotalPrice(state.cart);
  const result = applyPromoCode(code, subtotal);
  if (result.valid){
    state.appliedPromo = result;
    state.promoMessage = 'Промокод применён: −'+formatPrice(result.discount);
  } else {
    state.appliedPromo = null;
    state.promoMessage = 'Промокод не найден';
  }
  saveState();
}

function handleCheckoutSubmit(){
  const errors = validateContact(state.checkoutForm);
  if (isPhoneBlocked(state.checkoutForm.phone)) errors.blocked = 'Оформление заказа для этого номера ограничено. Свяжитесь с поддержкой.';
  state.checkoutErrors = errors;
  saveState();
  if (Object.keys(errors).length===0) go('#/delivery');
  else render(true);
}

function isPhoneBlocked(phone){
  const digits = (phone||'').replace(/\D/g,'');
  return (state.blockedCustomers||[]).indexOf(digits) !== -1;
}

function handleConfirmDelivery(){
  const d = state.deliveryOptions.find(x=>x.id===state.checkoutForm.delivery) || state.deliveryOptions[0];
  const subtotal = cartTotalPrice(state.cart);
  const discount = state.appliedPromo ? state.appliedPromo.discount : 0;
  const total = Math.max(0, subtotal-discount);
  const order = {
    id: state.nextOrderId,
    dateLabel: formatToday(),
    createdAt: new Date().toISOString(),
    status: 'pending_payment',
    email: state.checkoutForm.email,
    items: cartToOrderItems(state.cart),
    total: total,
    delivery: { id:d.id, dateRange: formatDateRange(d.minDays, d.maxDays) },
    customer: {
      name: state.checkoutForm.name, phone: state.checkoutForm.phone, email: state.checkoutForm.email,
      city: state.checkoutForm.city, address: state.checkoutForm.address, marketingConsent: !!state.checkoutForm.marketingConsent,
    },
    statusHistory: [{status:'pending_payment', ts:formatToday(), by:'покупатель'}],
  };
  state.orders.push(order);
  state.nextOrderId += 1;
  if (state.appliedPromo && state.appliedPromo.valid){
    const promo = (state.promoCodes||[]).find(function(p){ return p.code===state.appliedPromo.code; });
    if (promo) promo.usedCount = (promo.usedCount||0) + 1;
  }
  state.cart = [];
  state.appliedPromo = null;
  state.promoMessage = '';
  state.promoInput = '';
  state.checkoutForm = { name:'', phone:'+7', email:'', city:'', address:'', comment:'', delivery:'cdek', legalConsent:false, marketingConsent:false };
  state.checkoutErrors = {};
  saveState();

  // ТОЧКА ИНТЕГРАЦИИ С БАНКОМ: здесь сейчас синхронно эмулируется мгновенно успешная оплата.
  // После подключения реального банка/эквайринга этот вызов confirmPayment() уедет в обработчик
  // колбэка/вебхука об успешной оплате (заказ до этого момента будет висеть в статусе 'pending_payment').
  confirmPayment(order.id, { provider:'mock', transactionId:'MOCK-'+order.id });
  pushNotification('Заказ №'+order.id+': Оплачен', 'Оплата прошла успешно. Спасибо за заказ!', {orderId:order.id});

  go('#/success/'+order.id);
}

function currentAdmin(){ return state.admins.find(function(a){ return a.id===state.admin.currentAdminId; }); }

function adminCan(sectionKey){
  const a = currentAdmin();
  if (!a || a.active===false) return false;
  if (a.role==='superadmin') return true;
  if (sectionKey==='admins') return false;
  return a.permissions.indexOf(sectionKey)!==-1;
}

function logAdminAction(action){
  const a = currentAdmin();
  state.adminAuditLog.unshift({ id: Date.now()+'-'+Math.random().toString(36).slice(2), ts: new Date().toLocaleString('ru-RU'), adminId: a?a.id:null, adminName: a?a.name:'—', action: action });
  if (state.adminAuditLog.length>300) state.adminAuditLog.length = 300;
  saveState();
}

function deriveCustomers(){
  const map = new Map();
  state.orders.forEach(function(o){
    const c = o.customer; if (!c || !c.phone) return;
    const key = c.phone.replace(/\D/g,'');
    if (!map.has(key)) map.set(key, { phone:c.phone, phoneKey:key, name:c.name, email:c.email, city:c.city, marketingConsent:!!c.marketingConsent, ordersCount:0, totalSpent:0, lastOrderAt:o.createdAt });
    const rec = map.get(key);
    rec.ordersCount += 1;
    rec.totalSpent += o.total;
    if (!rec.lastOrderAt || (o.createdAt && o.createdAt > rec.lastOrderAt)){
      rec.lastOrderAt = o.createdAt; rec.name = c.name; rec.email = c.email; rec.city = c.city; rec.marketingConsent = !!c.marketingConsent;
    }
  });
  return Array.from(map.values());
}

function handleAdminOrderStatusChange(orderId, newStatus){
  const o = state.orders.find(function(x){ return x.id===orderId; });
  if (!o) return;
  o.status = newStatus;
  if (!o.statusHistory) o.statusHistory = [];
  const a = currentAdmin();
  o.statusHistory.push({status:newStatus, ts:new Date().toLocaleString('ru-RU'), by:(a?a.name:'админ')});
  logAdminAction('Изменил статус заказа №'+o.id+' на «'+(ORDER_STATUS_LABELS[newStatus]||newStatus)+'»');
  pushNotification('Заказ №'+o.id+': '+(ORDER_STATUS_LABELS[newStatus]||newStatus), 'Статус вашего заказа изменён на «'+(ORDER_STATUS_LABELS[newStatus]||newStatus)+'».', {orderId:o.id});
  saveState();
  render(true);
}

function handleAdminSaveTracking(orderId){
  const o = state.orders.find(function(x){ return x.id===orderId; });
  if (!o) return;
  const el = document.getElementById('trackingInput');
  const value = el ? el.value.trim() : '';
  if (!value) return;
  o.trackingNumber = value;
  logAdminAction('Добавил трек-номер для заказа №'+o.id+': '+value);
  pushNotification('Заказ №'+o.id+': трек-номер добавлен', 'Трек-номер вашей посылки: '+value+'. Посмотреть и скопировать его можно в заказе.', {orderId:o.id});

  render(true);
}

function handleAdminCatalogOpen(id){
  if (id){
    const p = state.products.find(function(x){ return x.id===id; });
    if (p){ state.adminDraft = Object.assign({}, p, {__id:p.id}); state.adminDraftType = 'product'; }
  } else {
    state.adminDraft = { __id:null, name:'', category:'seedling', latin:'', height:'', basePrice:900, discountPercent:0, img:PRODUCT_IMAGE_CHOICES[0], available:true, customDescription:'', pieces:4, unitLabel:'Набор 4 шт' };
    state.adminDraftType = 'product';
  }
  state.adminDraftError = null;
  saveState();
}

function handleAdminCatalogMove(id, dir){
  const list = state.products.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  const idx = list.findIndex(function(p){ return p.id===id; });
  if (idx===-1) return;
  const swapIdx = dir==='up' ? idx-1 : idx+1;
  if (swapIdx<0 || swapIdx>=list.length) return;
  const tmp = list[idx].order; list[idx].order = list[swapIdx].order; list[swapIdx].order = tmp;
  logAdminAction('Изменил порядок отображения товара «'+list[idx].name+'»');
  saveState();
  render(true);
}

function handleAdminCatalogToggleAvailable(id){
  const p = state.products.find(function(x){ return x.id===id; });
  if (!p) return;
  p.available = p.available===false ? true : false;
  logAdminAction((p.available?'Вернул в продажу':'Скрыл из каталога')+' товар «'+p.name+'»');
  saveState();
  render(true);
}

function screenAdminAnalytics(){
  const period = state.adminAnalyticsPeriod || 'all';
  const now = new Date();
  let from = null, to = null;
  if (period==='day'){ from = new Date(now); from.setDate(from.getDate()-1); }
  else if (period==='week'){ from = new Date(now); from.setDate(from.getDate()-7); }
  else if (period==='month'){ from = new Date(now); from.setMonth(from.getMonth()-1); }
  else if (period==='custom'){ from = state.adminAnalyticsFrom ? new Date(state.adminAnalyticsFrom) : null; to = state.adminAnalyticsTo ? new Date(state.adminAnalyticsTo) : null; }

  const orders = state.orders.filter(function(o){
    if (o.status==='pending_payment') return false;
    if (!o.createdAt) return true;
    const t = new Date(o.createdAt);
    if (from && t < from) return false;
    if (to && t > to) return false;
    return true;
  });

  const revenue = orders.reduce(function(s,o){ return s+o.total; },0);
  const avgCheck = orders.length ? Math.round(revenue/orders.length) : 0;
  const byProduct = {};
  orders.forEach(function(o){
    groupEntries(o.items).forEach(function(g){
      const p = getProduct(g.productId);
      if (!p) return;
      byProduct[p.name] = byProduct[p.name] || {qty:0, revenue:0};
      byProduct[p.name].qty += g.count;
      byProduct[p.name].revenue += p.price*g.count;
    });
  });
  const topProducts = Object.keys(byProduct).map(function(k){ return Object.assign({name:k}, byProduct[k]); }).sort(function(a,b){ return b.revenue-a.revenue; });

  const custMap = {};
  orders.forEach(function(o){ if (o.customer && o.customer.phone){ const k=o.customer.phone.replace(/\D/g,''); custMap[k]=(custMap[k]||0)+1; } });
  const newCustomers = Object.values(custMap).filter(function(n){ return n===1; }).length;
  const repeatCustomers = Object.values(custMap).filter(function(n){ return n>1; }).length;

  const byStatus = {};
  state.orders.forEach(function(o){ byStatus[o.status]=(byStatus[o.status]||0)+1; });

  const periodLabels = {all:'За всё время', day:'День', week:'Неделя', month:'Месяц', custom:'Период'};

  return '<div>'
    + '<h2 class="serif" style="font-size:20px;color:#21362A;margin:0 0 14px;">Аналитика</h2>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">'
    + Object.keys(periodLabels).map(function(k){
        return '<div data-admin-analytics-period="'+k+'" style="padding:11px 15px;min-height:16px;display:flex;align-items:center;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;'+(period===k?'background:#21362A;color:#F3EEE3;':'background:#F3EEE3;color:#4A564E;')+'">'+periodLabels[k]+'</div>';
      }).join('')
    + (period==='custom' ? ('<input type="date" id="adminAnalyticsFrom" class="field" style="margin:0;width:auto;" value="'+(state.adminAnalyticsFrom||'')+'"><input type="date" id="adminAnalyticsTo" class="field" style="margin:0;width:auto;" value="'+(state.adminAnalyticsTo||'')+'">') : '')
    + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;">'
    + adminStatCard('Выручка', formatPrice(revenue))
    + adminStatCard('Заказов', orders.length)
    + adminStatCard('Средний чек', formatPrice(avgCheck))
    + adminStatCard('Новые клиенты', newCustomers)
    + adminStatCard('Повторные клиенты', repeatCustomers)
    + '</div>'
    + '<div style="font-weight:700;font-size:13px;margin-bottom:10px;">Продажи по товарам</div>'
    + '<div style="background:#fff;border:1px solid #ECE7DA;border-radius:14px;padding:6px 16px;margin-bottom:20px;">'
    + (topProducts.length ? topProducts.map(function(p){
        return '<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid #F0EBDF;"><span>'+p.name+' · '+p.qty+' шт</span><span style="font-weight:700;">'+formatPrice(p.revenue)+'</span></div>';
      }).join('') : '<div style="color:#A9A398;font-size:12.5px;padding:10px 0;">Нет данных за период</div>')
    + '</div>'
    + '<div style="font-weight:700;font-size:13px;margin-bottom:10px;">Заказы по статусам</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;">'
    + Object.keys(byStatus).map(function(s){ return '<span style="'+(ORDER_STATUS_STYLES[s]||'')+'font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;">'+(ORDER_STATUS_LABELS[s]||s)+': '+byStatus[s]+'</span>'; }).join('')
    + '</div>'
    + '</div>';
}

function handleAdminDeleteConfirm(){
  const dc = state.adminDeleteConfirm;
  if (!dc) return;
  if (dc.type==='product'){
    const p = state.products.find(function(x){ return x.id===dc.id; });
    state.products = state.products.filter(function(x){ return x.id!==dc.id; });
    logAdminAction('Удалил товар «'+(p?p.name:dc.id)+'»');
  } else if (dc.type==='promo'){
    state.promoCodes = state.promoCodes.filter(function(x){ return x.code!==dc.id; });
    logAdminAction('Удалил промокод «'+dc.id+'»');
  } else if (dc.type==='delivery'){
    if (state.deliveryOptions.length>1){
      const d = state.deliveryOptions.find(function(x){ return x.id===dc.id; });
      state.deliveryOptions = state.deliveryOptions.filter(function(x){ return x.id!==dc.id; });
      logAdminAction('Удалил способ доставки «'+(d?d.name:dc.id)+'»');
    }
  } else if (dc.type==='admin'){
    const a = state.admins.find(function(x){ return x.id===dc.id; });
    if (a && a.role!=='superadmin'){
      state.admins = state.admins.filter(function(x){ return x.id!==dc.id; });
      logAdminAction('Удалил администратора «'+a.name+'»');
    }
  }
  state.adminDeleteConfirm = null;
  saveState();
  render(true);
}

function handleAdminDraftSave(){
  if (!state.adminDraft) return;
  const d = state.adminDraft;
  if (state.adminDraftType==='product'){
    if (!d.name || !d.name.trim()){ state.adminDraftError = 'Укажите название товара'; render(true); return; }
    const basePrice = Number(d.basePrice)||0;
    const discountPercent = Math.max(0, Math.min(90, Number(d.discountPercent)||0));
    const price = Math.round(basePrice*(1-discountPercent/100));
    if (d.__id){
      const p = state.products.find(function(x){ return x.id===d.__id; });
      Object.assign(p, { name:d.name, category:d.category, latin:d.latin, height:d.height, basePrice:basePrice, discountPercent:discountPercent, price:price, img:d.img, available:d.available!==false, customDescription:d.customDescription||'' });
      logAdminAction('Изменил товар «'+p.name+'»');
    } else {
      const newId = (d.category==='sapling'?'sapling-custom-':'seed-custom-') + Date.now();
      const maxOrder = state.products.reduce(function(m,p){ return Math.max(m,p.order||0); },0);
      state.products.push({ id:newId, category:d.category, filterGroup:d.category, speciesKey:null, name:d.name, latin:d.latin, height:d.height,
        basePrice:basePrice, discountPercent:discountPercent, price:price,
        pieces: d.category==='sapling'?1:4, unitLabel: d.category==='sapling'?'1 шт':'Набор 4 шт',
        img:d.img, available:d.available!==false, order:maxOrder+1, customDescription:d.customDescription||'' });
      logAdminAction('Добавил новый товар «'+d.name+'»');
    }
    state.adminDraft = null; state.adminDraftType = null; state.adminDraftError = null;
    saveState();
    go('#/admin/catalog');
    return;
  }
  if (state.adminDraftType==='promo'){
    if (!d.code || !d.code.trim()){ state.adminDraftError = 'Укажите код промокода'; render(true); return; }
    const codeUp = d.code.trim().toUpperCase();
    const value = Number(d.value)||0;
    const usageLimit = (d.usageLimit===''||d.usageLimit==null) ? null : Number(d.usageLimit);
    if (d.__id){
      const p = state.promoCodes.find(function(x){ return x.code===d.__id; });
      Object.assign(p, {code:codeUp, type:d.type, value:value, expiry:d.expiry||'', usageLimit:usageLimit, active:d.active!==false});
      logAdminAction('Изменил промокод «'+codeUp+'»');
    } else {
      if (state.promoCodes.some(function(x){ return x.code===codeUp; })){ state.adminDraftError = 'Промокод с таким кодом уже существует'; render(true); return; }
      state.promoCodes.push({code:codeUp, type:d.type||'percent', value:value, expiry:d.expiry||'', usageLimit:usageLimit, usedCount:0, active:true});
      logAdminAction('Создал промокод «'+codeUp+'»');
    }
    state.adminDraft = null; state.adminDraftType = null; state.adminDraftError = null;
    saveState(); render(true);
    return;
  }
  if (state.adminDraftType==='delivery'){
    if (!d.name || !d.name.trim()){ state.adminDraftError = 'Укажите название'; render(true); return; }
    if (d.__id){
      const opt = state.deliveryOptions.find(function(x){ return x.id===d.__id; });
      Object.assign(opt, {name:d.name, shortDesc:d.shortDesc, fullDesc:d.fullDesc, minDays:Number(d.minDays)||1, maxDays:Number(d.maxDays)||Number(d.minDays)||1});
      logAdminAction('Изменил способ доставки «'+opt.name+'»');
    } else {
      const newId = 'delivery-'+Date.now();
      state.deliveryOptions.push({id:newId, name:d.name, shortDesc:d.shortDesc||'', fullDesc:d.fullDesc||'', minDays:Number(d.minDays)||1, maxDays:Number(d.maxDays)||Number(d.minDays)||1});
      logAdminAction('Добавил способ доставки «'+d.name+'»');
    }
    state.adminDraft = null; state.adminDraftType = null; state.adminDraftError = null;
    saveState(); render(true);
    return;
  }
  if (state.adminDraftType==='adminAccount'){
    if (!d.name || !d.telegramId){ state.adminDraftError = 'Укажите имя и Telegram ID'; render(true); return; }
    if (d.__id){
      const a = state.admins.find(function(x){ return x.id===d.__id; });
      if (a.role!=='superadmin'){
        Object.assign(a, {name:d.name, telegramId:d.telegramId, role:d.role, permissions:d.permissions||[], active:d.active!==false});
      } else {
        Object.assign(a, {name:d.name, telegramId:d.telegramId, active:d.active!==false});
      }
      logAdminAction('Изменил администратора «'+a.name+'»');
    } else {
      state.admins.push({ id:'ad'+Date.now(), name:d.name, telegramId:d.telegramId, role:d.role||'manager', permissions:d.permissions||[], active:d.active!==false });
      logAdminAction('Добавил администратора «'+d.name+'»');
    }
    state.adminDraft = null; state.adminDraftType = null; state.adminDraftError = null;
    saveState(); render(true);
    return;
  }
}

function pushNotification(title, body, meta){
  state.notifications.unshift({ id: Date.now()+'-'+Math.random().toString(36).slice(2), title:title, body:body, ts:new Date().toLocaleString('ru-RU'), read:false, orderId:(meta&&meta.orderId)||null });

  sendTelegramMessage(title, body);
  saveState();
}

function handleSupportSend(){
  const textEl = document.getElementById('supportMessageInput');
  const orderEl = document.getElementById('supportOrderSelect');

  const orderId = orderEl && orderEl.value ? parseInt(orderEl.value,10) : null;
  const myPhone = state.profile.phone;
  let thread = state.supportThreads.find(function(t){ return t.customerPhone===myPhone && t.status==='open' && (orderId ? t.orderId===orderId : !t.orderId); });
  if (!thread){
    thread = { id:Date.now()+'-'+Math.random().toString(36).slice(2), customerPhone:myPhone, customerName:state.profile.name, orderId:orderId, status:'open', messages:[], adminUnread:true, createdAt:new Date().toISOString() };
    state.supportThreads.push(thread);
  }
  thread.messages.push({from:'customer', text:text, ts:new Date().toLocaleString('ru-RU')});
  thread.adminUnread = true;
  thread.lastMessageAt = new Date().toISOString();
  saveState();

  const relatedOrder = orderId ? state.orders.find(function(x){ return x.id===orderId; }) : null;
  const orderSummary = relatedOrder ? ('Заказ №'+relatedOrder.id+', '+(relatedOrder.customer?relatedOrder.customer.name:'')+', '+formatPrice(relatedOrder.total)) : '';
  notifyAdminsNewSupportMessage(thread.customerName, orderSummary, text);

  state.supportDraft = { text:'', orderId:'' };
  render(true);
}

/* ============================== EVENTS ============================== */

document.addEventListener('click', function(e){
  if (state.sortMenuOpen && !e.target.closest('#sortMenuWrap')){
    state.sortMenuOpen = false; render(true);
  }

  const navEl = e.target.closest('[data-nav]');
  if (navEl && !e.target.closest('[data-toggle-favorite]')){ go(navEl.getAttribute('data-nav')); return; }

  const addUnitEl = e.target.closest('[data-add-unit]');
  if (addUnitEl){ changeUnits(addUnitEl.getAttribute('data-add-unit'), 1); render(true); return; }

  const subUnitEl = e.target.closest('[data-sub-unit]');
  if (subUnitEl){ changeUnits(subUnitEl.getAttribute('data-sub-unit'), -1); render(true); return; }

  const qtyAddEl = e.target.closest('[data-product-qty-add]');
  if (qtyAddEl){ const id=qtyAddEl.getAttribute('data-product-qty-add'); state.productQty=state.productQty||{}; state.productQty[id]=(state.productQty[id]||1)+1; render(true); return; }

  const qtySubEl = e.target.closest('[data-product-qty-sub]');
  if (qtySubEl){ const id=qtySubEl.getAttribute('data-product-qty-sub'); state.productQty=state.productQty||{}; state.productQty[id]=Math.max(1,(state.productQty[id]||1)-1); render(true); return; }

  const addToBoxEl = e.target.closest('[data-product-add-to-box]');
  if (addToBoxEl){
    const id = addToBoxEl.getAttribute('data-product-add-to-box');
    const qty = (state.productQty && state.productQty[id]) || 1;
    addUnitsBulk(id, qty);
    state.productQty[id] = 1;
    go('#/cart');
    return;
  }

  const sortToggleEl = e.target.closest('#sortToggle');
  if (sortToggleEl){ state.sortMenuOpen = !state.sortMenuOpen; render(true); return; }

  const sortSelectEl = e.target.closest('[data-sort-select]');
  if (sortSelectEl){
    state.catalogSort = sortSelectEl.getAttribute('data-sort-select');
    state.sortMenuOpen = false;
    saveState(); render(true); return;
  }

  const boxToggleEl = e.target.closest('[data-box-toggle]');
  if (boxToggleEl){ state.boxWidgetCollapsed = !state.boxWidgetCollapsed; render(true); return; }

  const boxItemToggleEl = e.target.closest('[data-box-item-toggle]');
  if (boxItemToggleEl){
    const idx = boxItemToggleEl.getAttribute('data-box-item-toggle');
    const isLast = computeBoxes(state.cart).length-1 === Number(idx);
    if (!state.expandedBoxes) state.expandedBoxes = {};
    state.expandedBoxes[idx] = !isBoxExpanded(idx, isLast);
    render(true); return;
  }

  const removeEntryEl = e.target.closest('[data-remove-entry]');
  if (removeEntryEl){
    const uid = Number(removeEntryEl.getAttribute('data-remove-entry'));
    state.cart = state.cart.filter(function(e2){ return e2.uid!==uid; });
    saveState(); render(true); return;
  }

  const bulkSpeciesEl = e.target.closest('[data-bulk-species]');
  if (bulkSpeciesEl){
    const parts = bulkSpeciesEl.getAttribute('data-bulk-species').split('|');
    if (!state.bulkSpecies) state.bulkSpecies = {};
    state.bulkSpecies[parts[0]] = parts[1];
    saveState(); render(true); return;
  }

  const bulkAddEl = e.target.closest('[data-bulk-add-to-box]');
  if (bulkAddEl){
    const bulkId = bulkAddEl.getAttribute('data-bulk-add-to-box');
    const species = (state.bulkSpecies && state.bulkSpecies[bulkId]) || getProduct(bulkId).options[0];
    addEntry(bulkId, {bulk:true, species:species});
    saveState();
    go('#/cart');
    return;
  }

  if (e.target.getAttribute && e.target.getAttribute('data-close-doc')!==null){
    state.openDoc = null; render(true); return;
  }

  const openDocEl = e.target.closest('[data-open-doc]');
  if (openDocEl){ state.openDoc = openDocEl.getAttribute('data-open-doc'); render(true); return; }

  const toggleConsentEl = e.target.closest('[data-toggle-consent]');
  if (toggleConsentEl){
    const key = toggleConsentEl.getAttribute('data-toggle-consent') + 'Consent';
    state.checkoutForm[key] = !state.checkoutForm[key];
    saveState(); render(true); return;
  }

  const applyPromoEl = e.target.closest('[data-apply-promo]');
  if (applyPromoEl){ handleApplyPromo(); render(true); return; }

  const checkoutGoEl = e.target.closest('[data-checkout-go]');
  if (checkoutGoEl){ if (!checkoutGoEl.disabled && canCheckout(state.cart)) go('#/checkout'); return; }

  const submitCheckoutEl = e.target.closest('[data-submit-checkout]');
  if (submitCheckoutEl){ handleCheckoutSubmit(); return; }

  const selectDeliveryEl = e.target.closest('[data-select-delivery]');
  if (selectDeliveryEl){ state.checkoutForm.delivery = selectDeliveryEl.getAttribute('data-select-delivery'); saveState(); render(true); return; }

  const confirmDeliveryEl = e.target.closest('[data-confirm-delivery]');
  if (confirmDeliveryEl){ handleConfirmDelivery(); return; }

  const ordersTabEl = e.target.closest('[data-orders-tab]');
  if (ordersTabEl){ state.ordersTab = ordersTabEl.getAttribute('data-orders-tab'); render(true); return; }
});

  const trackingEl = e.target.closest('[data-admin-save-tracking]');

  const blockEl = e.target.closest('[data-admin-block-customer]');

  const delConfEl = e.target.closest('[data-admin-delete-confirm]');

  const delCancelEl = e.target.closest('[data-admin-delete-cancel]');
  if (delCancelEl){ handleAdminDeleteCancel(); return; }

  const promoNewEl = e.target.closest('[data-admin-promo-new]');
  if (promoNewEl){ state.adminDraft = {__id:null, code:'', type:'percent', value:10, expiry:'', usageLimit:null, active:true}; state.adminDraftType='promo'; state.adminDraftError=null; render(true); return; }
  const promoEditEl = e.target.closest('[data-admin-promo-edit]');
  if (promoEditEl){
    const code = promoEditEl.getAttribute('data-admin-promo-edit');
    const p = state.promoCodes.find(function(x){ return x.code===code; });
    if (p){ state.adminDraft = Object.assign({}, p, {__id:p.code}); state.adminDraftType='promo'; state.adminDraftError=null; render(true); }
    return;
  }
  const promoToggleEl = e.target.closest('[data-admin-promo-toggle]');
  if (promoToggleEl){
    const code = promoToggleEl.getAttribute('data-admin-promo-toggle');
    const p = state.promoCodes.find(function(x){ return x.code===code; });
    if (p){ p.active = p.active===false ? true : false; logAdminAction((p.active?'Включил':'Выключил')+' промокод «'+p.code+'»'); saveState(); render(true); }
    return;
  }

  const delNewEl = e.target.closest('[data-admin-delivery-new]');
  if (delNewEl){ state.adminDraft = {__id:null, name:'', shortDesc:'', fullDesc:'', minDays:3, maxDays:7}; state.adminDraftType='delivery'; state.adminDraftError=null; render(true); return; }
  const delEditEl = e.target.closest('[data-admin-delivery-edit]');
  if (delEditEl){
    const id = delEditEl.getAttribute('data-admin-delivery-edit');
    const d = state.deliveryOptions.find(function(x){ return x.id===id; });
    if (d){ state.adminDraft = Object.assign({}, d, {__id:d.id}); state.adminDraftType='delivery'; state.adminDraftError=null; render(true); }
    return;
  }

  const zoneAddEl = e.target.closest('[data-admin-zone-add]');
  if (zoneAddEl){
    const inp = document.getElementById('adminZoneInput');
    const val = inp ? inp.value.trim() : '';
    if (val && state.deliveryZones.indexOf(val)===-1){ state.deliveryZones.push(val); logAdminAction('Добавил город доставки «'+val+'»'); saveState(); render(true); }
    return;

  const zoneRemEl = e.target.closest('[data-admin-zone-remove]');

    saveState(); render(true); return;
  }

  const analyticsPeriodEl = e.target.closest('[data-admin-analytics-period]');
  if (analyticsPeriodEl){ state.adminAnalyticsPeriod = analyticsPeriodEl.getAttribute('data-admin-analytics-period'); saveState(); render(true); return; }

  const settingsSaveEl = e.target.closest('[data-admin-settings-save]');
  if (settingsSaveEl){ logAdminAction('Сохранил настройки магазина'); render(true); return; }

  const adminNewEl = e.target.closest('[data-admin-admin-new]');
  if (adminNewEl){ state.adminDraft = {__id:null, name:'', telegramId:'', role:'manager', permissions:[], active:true}; state.adminDraftType='adminAccount'; state.adminDraftError=null; render(true); return; }
  const adminEditEl = e.target.closest('[data-admin-admin-edit]');

    const id = adminEditEl.getAttribute('data-admin-admin-edit');
    const a = state.admins.find(function(x){ return x.id===id; });

    return;

  const permToggleEl = e.target.closest('[data-admin-perm-toggle]');
  if (permToggleEl && state.adminDraft){
    const key = permToggleEl.getAttribute('data-admin-perm-toggle');
    if (!state.adminDraft.permissions) state.adminDraft.permissions = [];
    const idx = state.adminDraft.permissions.indexOf(key);
    if (idx===-1) state.adminDraft.permissions.push(key); else state.adminDraft.permissions.splice(idx,1);
    render(true);
    return;
  }
  const fieldToggleEl = e.target.closest('[data-admin-field-toggle]');
  if (fieldToggleEl && state.adminDraft){
    const key = fieldToggleEl.getAttribute('data-admin-field-toggle');
    state.adminDraft[key] = (state.adminDraft[key]===false) ? true : false;

document.addEventListener('input', function(e){

    saveState(); render(true);
    const el = document.getElementById('adminCustomerSearch');
    if (el){ el.focus(); el.setSelectionRange(pos,pos); }
    return;
  }
  if (e.target.id==='adminAnalyticsFrom'){ state.adminAnalyticsFrom = e.target.value; saveState(); render(true); return; }

  if (e.target.matches('[data-admin-field]') && state.adminDraft){
    const f = e.target.getAttribute('data-admin-field');
    let v = e.target.value;
    if (e.target.getAttribute('data-numeric')!==null) v = v===''?'':Number(v);
    state.adminDraft[f] = v;
    saveState();
    if (e.target.tagName==='SELECT') render(true);
    return;
  }
  if (e.target.matches('[data-admin-settings-field]')){
    const f = e.target.getAttribute('data-admin-settings-field');
    state.settings[f] = e.target.value;
    saveState();
    // Название компании видно в шапке админ-панели прямо на этом же экране — перерисовываем
    // сразу, иначе выглядит так, будто изменение ни на что не повлияло, пока не уйдёшь со страницы.
    if (f==='companyName'){
      const pos = e.target.selectionStart;
      render(true);
      const el = document.querySelector('[data-admin-settings-field="companyName"]');
      if (el){ el.focus(); el.setSelectionRange(pos,pos); }
    }
    return;
  }
  if (e.target.matches('[data-admin-broadcast-field]')){
    if (!state.broadcastDraft) state.broadcastDraft = {text:'', audience:'consented'};
    const f = e.target.getAttribute('data-admin-broadcast-field');
    state.broadcastDraft[f] = e.target.value;
    saveState();
    if (f==='audience') render(true);
    return;
  }
});

// Некоторые WebView (в частности старые версии WebKit на iOS) не всегда генерируют событие
// 'input' для <select> — только 'change'. Подстраховываемся: любое 'change' на select
// синтетически повторяет 'input', чтобы вся логика выше сработала независимо от движка.
document.addEventListener('change', function(e){
  if (e.target.tagName==='SELECT'){
    e.target.dispatchEvent(new Event('input', {bubbles:true}));
  }
});

document.addEventListener('click', function(e){
  const favEl = e.target.closest('[data-toggle-favorite]');

  const copyTrackEl = e.target.closest('[data-copy-tracking]');
  if (copyTrackEl){
    const value = copyTrackEl.getAttribute('data-copy-tracking');
    const done = function(){ const old = copyTrackEl.textContent; copyTrackEl.textContent = 'Скопировано'; setTimeout(function(){ copyTrackEl.textContent = old; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(value).then(done).catch(function(){
        const ta = document.createElement('textarea');
        ta.value = value; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(e){}
        document.body.removeChild(ta);
        done();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = value; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      done();
    }
    return;
  }

  const openNotifEl = e.target.closest('[data-open-notification]');
  if (openNotifEl){ handleOpenNotification(openNotifEl.getAttribute('data-open-notification')); return; }

  const markAllEl = e.target.closest('[data-mark-all-read]');

/* ============================== TELEGRAM WEBAPP ============================== */

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

function tgInit(){
  if (!tg) return;
  try{ tg.ready(); tg.expand(); }catch(e){}
  // Обычный expand() всё равно оставляет системную шапку Telegram ("мини-приложение" и отступ
  // сверху) — requestFullscreen() убирает её и разворачивает вебапп на весь экран (Bot API 8.0+;
  // на старых клиентах метода просто не будет — тогда молча остаётся обычный expand()).
  try{ tg.requestFullscreen && tg.requestFullscreen(); }catch(e){}
  try{ tg.setHeaderColor && tg.setHeaderColor('#182A20'); }catch(e){}
  try{ tg.setBackgroundColor && tg.setBackgroundColor('#FAF7F0'); }catch(e){}
  // Без этого Telegram интерпретирует свайп вниз (когда контент проскроллен до самого верха)
  // как жест "свернуть приложение" — из-за этого вебапп сворачивался при обычном скролле.
  try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
  if (tg.BackButton){
    tg.BackButton.onClick(function(){ history.back(); });
  }
}

function tgUpdateBackButton(routeName){
  if (!tg || !tg.BackButton) return;
  const topLevel = ['home','catalog','cart','profile'];
  if (topLevel.indexOf(routeName)!==-1) tg.BackButton.hide();
  else tg.BackButton.show();
}

let didRestoreHash = false;
if (!location.hash || location.hash === '#'){
  try{
    const savedHash = localStorage.getItem('zn_last_hash');
    if (savedHash && savedHash !== '#' && savedHash !== ''){ location.hash = savedHash; didRestoreHash = true; }
  }catch(e){}
}
tgInit();
if (!didRestoreHash) render();
